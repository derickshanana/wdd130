<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Adventures</title>
    <meta name="description"
      content="Contact White Water Rafting Adventures for reservations, questions, or feedback. Find our address, phone numbers, email, and send us a message.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="Rafting Company Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-page">

        <h1>Contact Us</h1>

        <!-- COMPANY INFO -->
        <section class="company-info">
            <h2>Company Information</h2>
            <p><strong>Address:</strong> 123 River Rapids Road, Adventure Valley, UT 84000</p>
            <p><strong>Phone:</strong> +1 (800) 555-RAFT</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.086390!2d-122.4194!3d37.7749"
              loading="lazy">
            </iframe>
        </section>

        <!-- EMPLOYEES -->
        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/guide1.jpg" alt="Sarah Johnson, River Guide">
                    <figcaption>Sarah Johnson – Senior River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/guide2.jpg" alt="Michael Torres, Safety Instructor">
                    <figcaption>Michael Torres – Safety Instructor</figcaption>
                </figure>
                <figure>
                    <img src="images/guide3.jpg" alt="Emily Chen, Trip Coordinator">
                    <figcaption>Emily Chen – Trip Coordinator</figcaption>
                </figure>
            </div>
        </section>

        <!-- CONTACT FORM -->
        <section class="contact-form-section">
            <h2>Send Us a Message</h2>

            <form action="#" method="post" class="contact-form">

                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Your Message</legend>
                    <label><input type="radio" name="purpose" value="general" required> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="website"> Website
                        Suggestion</label>
                </fieldset>

                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label class="checkbox">
                    <input type="checkbox" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit" class="submit-btn">Send My Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting Adventures</p>
        <div class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
            <a href="#"><img src="images/linkedin.png" alt="Twitter"></a>
        </div>
    </footer>

</body>

</html>
